on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x', '24.x']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Try to build
        run: npm run build
      - name: Run application
        run: npm start -- -s

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run ci.typecheck
      - name: Check lint
        run: npm run ci.eslint -- src eslint.config.js jest.config.ts lint-staged.config.cjs
      - name: Check formatting
        run: npm run ci.prettier -- --check .
      - name: Run tests
        run: npm run test.ci
