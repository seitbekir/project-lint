on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x', '24.x']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Try to build
        run: npm run build
      - name: Run application
        run: npm start -- -s

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run ci.typecheck
      - name: Check lint
        run: npm run ci.eslint -- src eslint.config.js jest.config.ts lint-staged.config.cjs
      - name: Check formatting
        run: npm run ci.prettier -- --check .
      - name: Run tests
        run: npm run test.ci
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Generate Code Coverage report
        id: code-coverage
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          barecheck-api-key: ${{ secrets.BARECHECK_API_KEY }}
          lcov-file: './coverage/lcov.info'
          send-summary-comment: ${{ vars.COVERAGE_COMMENT == 'true' }}
          show-annotations: ${{ vars.COVERAGE_ANNOTATIONS }}
